name: Stage 01 CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api,llm,pdf,docx,ontology,dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests

      - name: Offline Stage 01 ablation
        run: python scripts/stage01_ablate.py
      - name: Publish Stage 01 ablation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage01-ablation
          path: outputs/stage01_ablation.json

      - name: Stage 02 semantic validation and competency questions
        run: |
          irf semantic-validate
          irf semantic-evaluate
