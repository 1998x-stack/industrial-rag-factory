name: Industrial RAG Factory CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[api,llm,pdf,docx,ontology,dev]'
      - run: python -m pytest -q
      - run: python -m ruff check src tests

      - name: Offline Stage 01 ablation
        run: python scripts/stage01_ablate.py
      - name: Publish Stage 01 ablation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage01-ablation
          path: outputs/stage01_ablation.json

      - name: Stage 02 semantic validation and competency questions
        run: |
          irf semantic-validate
          irf semantic-evaluate

      - name: Stage 03 cross-source evaluation
        run: |
          irf multisource-assess B-104
          irf multisource-evaluate
          python scripts/stage03_evaluate.py
      - name: Publish Stage 03 fixture evaluation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage03-evaluation
          path: outputs/stage03_evaluation.json

      - name: Stage 04 offline planner / DAG verification
        run: |
          irf agent-plan "B-104 振动异常"
          irf agent-query "B-104 振动异常"
          irf agent-evaluate
          python scripts/stage04_evaluate.py
      - name: Publish Stage 04 planner evaluation
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage04-evaluation
          path: outputs/stage04_evaluation.json

      - name: Stage 05 evidence and claim verification
        run: |
          irf grounding-verify B-104
          irf grounding-verify B-999
          irf grounding-evaluate
          python scripts/stage05_evaluate.py
      - name: Publish Stage 05 claim verification report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage05-evaluation
          path: outputs/stage05_evaluation.json

      - name: Stage 06 security regression report
        run: python scripts/stage06_evaluate.py
      - name: Publish Stage 06 security report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage06-security-evaluation
          path: outputs/stage06_security_evaluation.json

      - name: Stage 07 factorial ablation + evidence report
        run: python scripts/stage07_ablate.py
      - name: Publish Stage 07 experiment and HTML report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage07-ablation
          path: |
            outputs/stage07_ablation.json
            outputs/stage07_report.html

      - name: Stage 08 blue-green release and disaster-recovery smoke
        run: python scripts/stage08_drill.py
      - name: Publish Stage 08 readiness and rollback report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: stage08-readiness
          path: outputs/stage08_release_drill.json

  hf-real-smoke:
    name: Public IndustryBench live download + RAG smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      HF_HUB_ETAG_TIMEOUT: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[huggingface]'
      - name: Download pinned public IndustryBench and run real RAG
        run: |
          python scripts/stage09_hf_benchmark.py --fetch --limit-per-split 8 --k 3 \
            --modes sparse hybrid
      - name: Publish real public-data result, no corpus text
        uses: actions/upload-artifact@v4
        with:
          name: stage09-real-hf-report
          path: outputs/stage09_hf_report.json
          if-no-files-found: error
