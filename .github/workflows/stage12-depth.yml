name: Stage 12 real reranker depth ablation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/industrial_rag_factory/hfbench/depth.py'
      - 'scripts/stage12_rerank_depth.py'
      - '.github/workflows/stage12-depth.yml'
jobs:
  depth-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "90"
      HF_HUB_ETAG_TIMEOUT: "45"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install pretrained evaluation dependencies
        run: pip install -e '.[pretrained-benchmark]'
      - name: Compare genuine CrossEncoder depth 4/8/12
        run: |
          python scripts/stage12_rerank_depth.py --fetch --per-class 3 \
            --extra-corpus 8 --depths 4 8 12
      - name: Archive genuine depth measurements
        uses: actions/upload-artifact@v4
        with:
          name: stage12-real-rerank-depth
          path: outputs/stage12_rerank_depth.json
          if-no-files-found: error
