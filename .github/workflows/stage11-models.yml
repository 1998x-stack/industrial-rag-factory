name: Stage 11 real pretrained model comparison
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/industrial_rag_factory/hfbench/stage11.py'
      - 'src/industrial_rag_factory/hfbench/rerank.py'
      - 'scripts/stage11_benchmark.py'
      - '.github/workflows/stage11-models.yml'
jobs:
  real-model-comparison:
    name: CPU multilingual encoder + CrossEncoder on public TechQA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DOWNLOAD_TIMEOUT: "90"
      HF_HUB_ETAG_TIMEOUT: "45"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyTorch CPU wheel
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install public benchmark and encoder
        run: pip install -e '.[huggingface,dense]'
      - name: Download real TechQA and pretrained weights, run head-to-head
        run: |
          python scripts/stage11_benchmark.py --fetch --per-class 3 --extra-corpus 8 \
            --pretrained --k 3
      - name: Publish actual semantic experiment
        uses: actions/upload-artifact@v4
        with:
          name: stage11-pretrained-techqa
          path: outputs/stage11_benchmark.json
          if-no-files-found: error
