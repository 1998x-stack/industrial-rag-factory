[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "industrial-rag-factory"
version = "0.1.0"
description = "Stage-driven, evidence-grounded industrial RAG factory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
api = ["Flask>=3,<4"]
llm = ["openai>=1.40,<3"]
pdf = ["PyMuPDF>=1.24,<2"]
docx = ["python-docx>=1.1,<2"]
dense = ["sentence-transformers>=3,<6"]
observability = ["opentelemetry-api>=1.28,<2"]
huggingface = ["huggingface-hub>=0.27,<2"]
ontology = ["rdflib>=7,<9", "pyshacl>=0.30,<1"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
[project.scripts]
irf = "industrial_rag_factory.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
